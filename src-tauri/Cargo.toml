[package]
name = "pilihfotomu-desktop"
version = "0.1.0"
description = "pilihfotomu Desktop — offline photo culling"
authors = ["pilihfotomu"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pilihfotomu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rayon = "1.12.0"
kamadak-exif = "0.6.1"
regex = "1.13.1"
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.3"
tract-onnx = "0.23.9"


[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# Full-resolution RAW decoding in the loupe (WIC, see full_res.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Dependencies optimized even in `tauri dev`: image decoding and the face
# models are 10–50× slower unoptimized.
[profile.dev.package."*"]
opt-level = 3

# Our own crate lightly optimized: its per-pixel loops (sharpness, model
# inputs) made an analysis ~5× slower at opt-level 0 (20 photos: 14.5 s,
# 2.9 s here, 1.5 s in release). Still debuggable, compiles a little slower.
[profile.dev]
opt-level = 1
